# Optimize the OpenClaw skill edit proposer with DSPy GEPA.
output_dir: "outputs"

# Leave empty to use the latest outputs/*_trajectory_analysis directory.
trajectory_analysis_dir: ""

task_path: "data/openclaw_skillopt_validation_tasks.jsonl"
openclaw_agent_model: "vllm/google/gemma-4-E4B-it"
openclaw_live_skill_path: "/home/sbplab/.openclaw/workspace/skills/mimo-audio/SKILL.md"
openclaw_timeout_sec: 600
openclaw_max_turns: 3
require_generated_audio: true
max_tasks: 2

gemma_base_url: "http://100.70.253.93:8000/v1"
gemma_model: "openai/google/gemma-4-E4B-it"
gemma_api_key: "sk-local"
proposer_temperature: 0.0
proposer_max_tokens: 5000

# Keep the teaching run intentionally small. DSPy GEPA treats this as an
# approximate budget and may run extra validation evals around reflection.
max_metric_calls: 2
reflection_minibatch_size: 1
num_threads: 1
seed: 0
skip_perfect_score: false
tie_score: 0.5
